<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariage J&D — Diaporama</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100vw;height:100vh;
  overflow:hidden;background:#000;
}

/* ── Diaporama plein écran ── */
#stage{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
}
.slide{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 1.2s ease-in-out;
}
.slide.on{opacity:1}
.slide img{max-width:100%;max-height:100%;object-fit:contain}

/* ── Overlay scène ── */
#overlay{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  background:#000;opacity:0;
  transition:opacity 1.2s;pointer-events:none;z-index:10;
}
#overlay.on{opacity:1}
#overlay img{max-width:100%;max-height:100%;object-fit:contain}

/* ── Label scène ── */
#scene-label{
  position:absolute;bottom:32px;left:50%;
  transform:translateX(-50%);
  font:22px/1 sans-serif;
  color:rgba(255,255,255,.35);
  letter-spacing:.14em;text-transform:uppercase;
  opacity:0;transition:opacity .8s;z-index:11;white-space:nowrap;
}
#scene-label.on{opacity:1}

#empty{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,.3);font:24px sans-serif;
  text-align:center;
}
</style>
</head>
<body>

<div id="stage"></div>
<div id="overlay"><img id="ov-img" src="" alt=""></div>
<div id="scene-label"></div>

<script>
(function(){
var SLIDES=[{"name":"20260606_214430_195.jpg","url":"https://lh3.googleusercontent.com/d/18H3n5tLNbnJ4nl_Ve6PT9BmCh9Q9F14D"},{"name":"20260606_214536_833.jpg","url":"https://lh3.googleusercontent.com/d/1v0MG2vrZozn6v0Oufv7ymAxRSPo0JXFB"},{"name":"20260606_214730_450.jpg","url":"https://lh3.googleusercontent.com/d/1DvofrBRbe-dPOiZcZ8KtJofJADtQS6hi"},{"name":"20260606_215020_398.jpg","url":"https://lh3.googleusercontent.com/d/1auqOBwgMrySlZ5lSZnVSO2B14o3rjjiS"},{"name":"20260606_215220_496.jpg","url":"https://lh3.googleusercontent.com/d/1NCJnpnTVVoTBwvh6PJbk3BtnAxAd3uos"},{"name":"20260606_215352_240.jpg","url":"https://lh3.googleusercontent.com/d/1yJEJRAnWmxIi-Wgw8lJmF9YDNqI10Xic"},{"name":"20260606_215456_978.jpg","url":"https://lh3.googleusercontent.com/d/1t9o8imGGihSzo3oCSght3vHToZiYTzn-"},{"name":"20260606_220134_274.jpg","url":"https://lh3.googleusercontent.com/d/1BEL_ii3lRwhU5tWYDDNM4enevfF_Sqcx"},{"name":"20260606_220348_555.jpg","url":"https://lh3.googleusercontent.com/d/1o1UO1Gji1tUt_5a8IgzWLbYIy-Lu73L8"},{"name":"20260606_220542_219.jpg","url":"https://lh3.googleusercontent.com/d/1iblmpEV3l-qYut6VDWUf4jzEdjlieYy7"},{"name":"20260606_220702_484.jpg","url":"https://lh3.googleusercontent.com/d/1zVQf28g6ZjjP9xzax0TzmvjvKKR3orN5"},{"name":"20260606_220941_339.jpg","url":"https://lh3.googleusercontent.com/d/1NaKJc7-JJNNphDVNkIfSvZcGTJyswnl5"},{"name":"20260606_221242_497.jpg","url":"https://lh3.googleusercontent.com/d/14hweG2URXjEkPxaKtHkaDn94jr3SUZG6"},{"name":"20260606_223000_592.jpg","url":"https://lh3.googleusercontent.com/d/1IJodouvrFqEiE3dcX9ca_NCbmJz9scs2"},{"name":"20260606_225739_157.jpg","url":"https://lh3.googleusercontent.com/d/1GSguECOOv1fq9-E6d4LlWlFCF536gKeK"},{"name":"20260606_230318_667.jpg","url":"https://lh3.googleusercontent.com/d/1GS3rqOCgW80srt4xdvXEIM30poJ7AA80"},{"name":"20260606_231811_335.jpg","url":"https://lh3.googleusercontent.com/d/1_LL1MSNO0fCQ74httDPJcBsGVIg_oUEC"},{"name":"20260606_232646_874.jpg","url":"https://lh3.googleusercont var SCENES={};
var UPSTASH_URL='https://romantic-sheep-89360.upstash.io';
var UPSTASH_TOKEN='gQAAAAAAAV0QAAIncDE3OTMxNWE2OTEyMzk0OGE0YmZkNmI5NmI0ZTk4MmI3MXAxODkzNjA';
var SLIDE_MS=8000,REFRESH_MS=900000,POLL_MS=5000;
var cur=0,els=[],timer=null,lastScene='__init__',inScene=false;
var stage=document.getElementById('stage');
var overlay=document.getElementById('overlay');
var ovImg=document.getElementById('ov-img');
var label=document.getElementById('scene-label');

for(var i=0;i<SLIDES.length;i++){
  var d=document.createElement('div');d.className='slide';
  var img=document.createElement('img');img.src=SLIDES[i].url;img.alt=SLIDES[i].name;
  d.appendChild(img);stage.appendChild(d);els.push(d);
}

function show(idx){
  for(var i=0;i<els.length;i++)els[i].className='slide';
  if(els[idx])els[idx].className='slide on';
  var n=(idx+1)%(els.length||1);
  if(SLIDES[n])(new Image()).src=SLIDES[n].url;
}
function advance(){if(inScene)return;cur=(cur+1)%(els.length||1);show(cur);timer=setTimeout(advance,SLIDE_MS);}
function start(){if(timer){clearTimeout(timer);timer=null;}if(!els.length)return;show(cur);timer=setTimeout(advance,SLIDE_MS);}

function applyScene(k){
  if(k===lastScene)return;lastScene=k;
  if(k==='auto'||!SCENES[k]){
    inScene=false;overlay.className='';label.className='';
    setTimeout(function(){ovImg.src='';label.textContent='';},1400);
    start();
  } else {
    inScene=true;if(timer){clearTimeout(timer);timer=null;}
    var s=SCENES[k];ovImg.src=s.url;
    if(s.label)label.textContent=s.label;
    setTimeout(function(){overlay.className='on';if(s.label)label.className='on';},80);
  }
}

function poll(){
  if(!UPSTASH_URL)return;
  var x=new XMLHttpRequest();
  x.open('GET',UPSTASH_URL+'/get/signage_scene',true);
  x.setRequestHeader('Authorization','Bearer '+UPSTASH_TOKEN);
  x.timeout=2500;
  x.onreadystatechange=function(){
    if(x.readyState!==4||x.status!==200)return;
    try{var d=JSON.parse(x.responseText);applyScene(d&&d.result?d.result:'auto');}catch(e){}
  };
  x.send();
}

if(els.length)start();
else document.getElementById('stage').innerHTML='<div id="empty">Aucune photo pour le moment</div>';

setInterval(poll,POLL_MS);poll();
setTimeout(function(){location.reload();},REFRESH_MS);
})();
</script>
</body>
</html>
